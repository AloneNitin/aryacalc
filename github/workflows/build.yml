
name: Build Aryacalc APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: unzip -o Aryacalc_Flutter_Source.zip

      - name: Prepare Flutter
        working-directory: aryacalc_flutter
        run: flutter create . --platforms=android

      - name: Install packages
        working-directory: aryacalc_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: aryacalc_flutter
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Aryacalc-APK
          path: aryacalc_flutter/build/app/outputs/flutter-apk/app-release.apk

