.

name: Aryacalc Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Aryacalc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract source
        run: unzip -o Aryacalc_Flutter_Source.zip

      - name: Create Android project
        working-directory: aryacalc_flutter
        run: flutter create . --platforms=android

      - name: Install dependencies
        working-directory: aryacalc_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: aryacalc_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aryacalc-APK
          path: aryacalc_flutter/build/app/outputs/flutter-apk/app-release.apk
